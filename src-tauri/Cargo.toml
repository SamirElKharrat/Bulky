[package]
name = "bulksort"
version = "0.2.0"
description = "Organiza tu bulk de Riftbound"
edition = "2021"

[lib]
name = "bulksort_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
tauri-plugin-dialog = "2"
